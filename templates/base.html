<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ title or "Музыка" }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    {% block content %}{% endblock %}
  </main>
  <div class="persistent-bars">
    <audio id="audio" preload="none"></audio>

    <!-- Mini Player Bar -->
    <nav class="mini-player is-hidden" id="miniPlayer">
      <img class="mini-player-cover" id="miniCover" alt="" hidden>
      <div class="mini-player-info">
        <div class="mini-player-title" id="miniTitle"></div>
        <div class="mini-player-artist" id="miniArtist"></div>
      </div>
      <button class="mini-player-btn play" id="miniPlayPause" type="button" aria-label="Воспроизвести/Пауза">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
    </nav>

    <!-- Fullscreen Player -->
    <div class="fullscreen-player" id="fullscreenPlayer">
      <div class="fs-bg" id="fsBg"></div>
      <div class="fs-content">
        <div class="fs-header">
          <button class="fs-header-btn" id="fsClose" type="button" aria-label="Свернуть">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div style="flex:1"></div>
          <button class="fs-header-btn" id="fsQueueBtn" type="button" aria-label="Очередь">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h12"/></svg>
          </button>
        </div>
        <div class="fs-cover-wrap">
          <img class="fs-cover" id="fsCover" alt="">
        </div>
        <div class="fs-track-info">
          <div class="fs-title" id="fsTitle"></div>
          <div class="fs-artist" id="fsArtist"></div>
        </div>
        <div class="fs-scrubber">
          <div class="fs-time">
            <span id="fsCurrentTime">0:00</span>
            <span id="fsTotalTime">0:00</span>
          </div>
          <div class="fs-scrubber-track" id="fsScrubberTrack">
            <div class="fs-scrubber-fill" id="fsScrubberFill"></div>
            <div class="fs-scrubber-thumb" id="fsScrubberThumb"></div>
          </div>
        </div>
        <div class="fs-controls">
          <button class="fs-control-btn" id="fsPrev" type="button" aria-label="Предыдущий">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
          </button>
          <button class="fs-control-btn main" id="fsPlayPause" type="button" aria-label="Воспроизвести/Пауза">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="fs-control-btn" id="fsNext" type="button" aria-label="Следующий">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Навигация по приложению">
      <a class="bottom-nav__item {% if request.path == '/' %}is-active{% endif %}" href="{{ url_for('index') }}">
        <span class="bottom-nav__icon">⌂</span>
        <span class="bottom-nav__label">Главная</span>
      </a>
      <a class="bottom-nav__item {% if request.path == '/' %}is-active{% endif %}" href="{{ url_for('index') }}#create-album">
        <span class="bottom-nav__icon">＋</span>
        <span class="bottom-nav__label">Создать альбом</span>
      </a>
      <a class="bottom-nav__item {% if request.path == '/favorites' %}is-active{% endif %}" href="{{ url_for('favorites') }}">
        <span class="bottom-nav__icon">♡</span>
        <span class="bottom-nav__label">Избранное</span>
      </a>
    </nav>
  </div>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
